; Configurazione OPcache per l'immagine di produzione.
;
; opcache.validate_timestamps=0 ignora le modifiche ai file PHP dopo l'avvio:
; corretto per un'immagine immutabile (rebuild ad ogni deploy), ma va rimesso
; a 1 (o rimosso) se si monta il codice come bind-mount per iterare senza
; ricostruire l'immagine.
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=0
opcache.save_comments=1
