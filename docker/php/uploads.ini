; Limiti upload per i PDF di pagina — coerenti col client_max_body_size 120m
; già impostato in docker/nginx/default.conf (nginx resta più permissivo,
; PHP è il limite effettivo). Allineare a config/livewire.php
; (temporary_file_upload.rules) se questi valori cambiano.
;
; Alzati da 32M/40M a 100M/110M il 2026-07-31: PDF multipagina reali di una
; rivista ad alta risoluzione superavano facilmente 40MB totali, causando il
; bug "si blocca al caricamento" documentato in HANDOFF.md (il fix
; display_errors sotto lo rende comunque innocuo, ma resta preferibile che
; un caricamento legittimo passi invece di fallire con un errore visibile).
upload_max_filesize = 100M
post_max_size = 110M

; Nessun ini esistente tocca memory_limit (default stock ~128M): la
; conversione Imagick/Ghostscript a 150 DPI di una pagina rivista a colori
; può essere pesante in RAM.
memory_limit = 256M

; display_errors=Off (bug scoperto il 2026-07-31): quando un upload supera
; post_max_size, PHP-FPM emette un warning nativo del core ("POST Content-
; Length ... exceeds the limit") PRIMA che Laravel venga bootstrappato — non
; è un errore applicativo intercettabile da noi. Con display_errors=On
; (default compilato in questa immagine, nessun php.ini viene caricato —
; vedi "Loaded Configuration File: (none)" in `php --ini`), quel warning
; viene stampato come HTML grezzo ("<br />\n<b>Warning</b>...") DAVANTI al
; JSON di risposta di /livewire/upload-file, corrompendolo. Il client
; (livewire.js, JSON.parse della risposta XHR) va in eccezione non gestita e
; l'upload sembra "bloccarsi" senza alcun messaggio per l'utente. Log su
; stderr (catturato da `docker compose logs app`) invece di stampare in
; risposta, cosí l'errore resta diagnosticabile senza rompere il client.
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2
