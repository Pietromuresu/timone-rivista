server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Allineato a docker/php/uploads.ini (post_max_size 110M) — deve restare
    # sopra il limite PHP, altrimenti nginx respinge la richiesta con un suo
    # 413 HTML prima che PHP la veda (stessa classe di problema del bug
    # "si blocca al caricamento" documentato in HANDOFF.md, anche se questo
    # 413 non corrompe il JSON: Livewire lo gestisce comunque come errore
    # perché non è uno status 2xx).
    client_max_body_size 120m;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    # Nega l'accesso ai dotfile (.env, .git, ecc.) se mai finissero sotto public/.
    location ~ /\. {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        # try_files è indispensabile qui, non solo un dettaglio di cache:
        # /livewire/livewire.js (il runtime JS di Livewire) e /livewire/*
        # (upload temporanei, preview immagini) sono generati dinamicamente
        # da Laravel, non file reali sotto public/ — senza fallback a
        # index.php, questo blocco (che intercetta qualunque URL finisca in
        # .js) rispondeva 404 prima ancora che la richiesta arrivasse a
        # PHP, disabilitando *tutta* l'interattività Livewire lato client
        # (bug scoperto il 2026-07-29: cambio vista, drag&drop, azioni di
        # massa, assegnazione contenuti — nulla di client-side funzionava).
        try_files $uri $uri/ /index.php?$query_string;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
    }
}
