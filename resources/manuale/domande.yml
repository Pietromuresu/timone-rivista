# Domande iniziali dell'assistente «Chiedi al manuale» (2026-10-29).
#
# Ogni voce collega un compito alla pagina che lo spiega: 3–6 modi diversi
# di chiedere la stessa cosa, come li scriverebbe un collega. La risposta
# NON è qui: l'assistente mostra sempre il blocco «In breve» della pagina,
# così cambiando la pagina cambia anche la risposta.
#
# Formato (letto da App\Support\Manual\ManualQuestions, un test lo controlla):
#   - pagina: slug-della-pagina
#     domande:
#       - prima domanda
#       - seconda domanda
#
# Ogni domanda di questo file deve trovare la sua pagina al primo posto
# (tests/Feature/ManualAssistantTest.php): se aggiungi una domanda che
# porta altrove, correggi la pagina (parole chiave, sinonimi) o la domanda.

