name: timone-rivista

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage/app
    healthcheck:
      # Verifica che php-fpm sia davvero in ascolto sulla sua porta interna
      # (9000), non solo che il container sia partito — nc fa parte di
      # busybox, già presente nell'immagine php:8.2-fpm-alpine.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [timone]

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx_runtime
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [timone]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work redis --tries=3 --backoff=3 --sleep=1
    volumes:
      - storage_data:/var/www/html/storage/app
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [timone]

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    restart: unless-stopped
    env_file: .env
    # legge REVERB_SERVER_HOST/REVERB_SERVER_PORT da .env (già 0.0.0.0:8080)
    command: php artisan reverb:start
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [timone]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # Un'unica fonte per ciascun valore: MYSQL_DATABASE/USER/PASSWORD
      # leggono le stesse chiavi DB_DATABASE/DB_USERNAME/DB_PASSWORD che
      # Laravel usa per connettersi — impossibile impostarne una e
      # dimenticare l'altra, perché non esiste più "l'altra": sono la
      # stessa variabile letta due volte. MYSQL_ROOT_PASSWORD resta una
      # variabile a sé (è davvero un'altra password, quella dell'utente
      # "root" di MySQL, non quella dell'utente applicativo).
      MYSQL_DATABASE: ${DB_DATABASE:-timone}
      MYSQL_USER: ${DB_USERNAME:-timone}
      MYSQL_PASSWORD: ${DB_PASSWORD:?manca DB_PASSWORD in .env — esegui ./setup.sh, che la genera da solo, oppure impostala tu e rilancia}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?manca MYSQL_ROOT_PASSWORD in .env — esegui ./setup.sh, che la genera da solo, oppure impostala tu e rilancia}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [timone]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [timone]

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [timone]

  # Non parte con `docker compose up` (profilo "tools"). Uso:
  #   docker compose run --rm backup
  backup:
    image: mysql:8.4
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-timone}
      DB_USERNAME: ${DB_USERNAME:-timone}
      DB_PASSWORD: ${DB_PASSWORD:?manca DB_PASSWORD in .env — esegui ./setup.sh, che la genera da solo, oppure impostala tu e rilancia}
    volumes:
      - ./docker/mysql/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks: [timone]

networks:
  timone:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
