name: timone-rivista

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        # Servono al bundle JS lato client (Echo/Pusher) generato da "npm
        # run build" dentro lo stage node_builder — .env è escluso a priori
        # dal contesto Docker (.dockerignore), quindi Vite non lo vedrebbe
        # mai da solo: vanno passati esplicitamente come build arg, letti
        # da Compose dallo stesso .env di root. Vedi nota nel Dockerfile.
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    restart: unless-stopped
    env_file: .env
    volumes:
      - storage_data:/var/www/html/storage/app
      # Bug scoperto il 2026-07-31: storage/logs NON era persistito, solo
      # storage/app — ogni `docker compose up -d`/rebuild cancellava
      # silenziosamente laravel.log, rendendo impossibile diagnosticare un
      # errore reale segnalato dall'utente ("si blocca al caricamento") se
      # nel frattempo il container era stato ricreato. Ora sopravvive ai
      # riavvii, coerente con storage/app.
      - storage_logs:/var/www/html/storage/logs
      # Esito dei backup (sola lettura): timone:backup-test-alert e pagina admin.
      - backup_status:/var/backup-status:ro
    healthcheck:
      # Verifica che php-fpm sia davvero in ascolto sulla sua porta interna
      # (9000), non solo che il container sia partito — nc fa parte di
      # busybox, già presente nell'immagine php:8.2-fpm-alpine.
      test: ["CMD", "nc", "-z", "127.0.0.1", "9000"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [timone]

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
      target: nginx_runtime
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      app:
        condition: service_healthy
    networks: [timone]

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        # Servono al bundle JS lato client (Echo/Pusher) generato da "npm
        # run build" dentro lo stage node_builder — .env è escluso a priori
        # dal contesto Docker (.dockerignore), quindi Vite non lo vedrebbe
        # mai da solo: vanno passati esplicitamente come build arg, letti
        # da Compose dallo stesso .env di root. Vedi nota nel Dockerfile.
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    restart: unless-stopped
    env_file: .env
    command: php artisan queue:work redis --tries=3 --backoff=3 --sleep=1
    volumes:
      - storage_data:/var/www/html/storage/app
      # Bug scoperto il 2026-07-31: storage/logs NON era persistito, solo
      # storage/app — ogni `docker compose up -d`/rebuild cancellava
      # silenziosamente laravel.log, rendendo impossibile diagnosticare un
      # errore reale segnalato dall'utente ("si blocca al caricamento") se
      # nel frattempo il container era stato ricreato. Ora sopravvive ai
      # riavvii, coerente con storage/app.
      - storage_logs:/var/www/html/storage/logs
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [timone]

  reverb:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        # Servono al bundle JS lato client (Echo/Pusher) generato da "npm
        # run build" dentro lo stage node_builder — .env è escluso a priori
        # dal contesto Docker (.dockerignore), quindi Vite non lo vedrebbe
        # mai da solo: vanno passati esplicitamente come build arg, letti
        # da Compose dallo stesso .env di root. Vedi nota nel Dockerfile.
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    restart: unless-stopped
    env_file: .env
    # legge REVERB_SERVER_HOST/REVERB_SERVER_PORT da .env (già 0.0.0.0:8080)
    command: php artisan reverb:start
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "8080"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [timone]

  # Fase 5.3: senza questo servizio, routes/console.php (Schedule::command)
  # non ha mai modo di "ticchettare" in produzione — nessun cron esterno
  # esiste in questo stack, `schedule:work` è il loop foreground nativo di
  # Laravel (dorme e si risveglia da solo ogni minuto, nessuna dipendenza di
  # sistema aggiuntiva rispetto a worker/reverb). Servizio a sé, non un
  # secondo comando dentro `worker`: un container fa un solo processo
  # principale in questo progetto (stesso principio già seguito da
  # app/nginx/worker/reverb), infilare `schedule:work` dentro `worker`
  # richiederebbe un supervisore di processi solo per questo.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
      args:
        VITE_REVERB_APP_KEY: ${REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-localhost}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-8080}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-http}
    restart: unless-stopped
    env_file: .env
    command: php artisan schedule:work
    volumes:
      - storage_data:/var/www/html/storage/app
      - storage_logs:/var/www/html/storage/logs
      # Esito dei backup, per il controllo delle 26 ore (sola lettura).
      - backup_status:/var/backup-status:ro
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [timone]

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      # Un'unica fonte per ciascun valore: MYSQL_DATABASE/USER/PASSWORD
      # leggono le stesse chiavi DB_DATABASE/DB_USERNAME/DB_PASSWORD che
      # Laravel usa per connettersi — impossibile impostarne una e
      # dimenticare l'altra, perché non esiste più "l'altra": sono la
      # stessa variabile letta due volte. MYSQL_ROOT_PASSWORD resta una
      # variabile a sé (è davvero un'altra password, quella dell'utente
      # "root" di MySQL, non quella dell'utente applicativo).
      MYSQL_DATABASE: ${DB_DATABASE:-timone}
      MYSQL_USER: ${DB_USERNAME:-timone}
      MYSQL_PASSWORD: ${DB_PASSWORD:?manca DB_PASSWORD in .env — esegui ./setup.sh, che la genera da solo, oppure impostala tu e rilancia}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?manca MYSQL_ROOT_PASSWORD in .env — esegui ./setup.sh, che la genera da solo, oppure impostala tu e rilancia}
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks: [timone]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [timone]

  adminer:
    image: adminer:latest
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: mysql
    ports:
      - "8081:8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks: [timone]

  # Non parte con `docker compose up` (profilo "tools"). Uso:
  #   docker compose run --rm backup
  backup:
    image: mysql:8.4
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-timone}
      DB_USERNAME: ${DB_USERNAME:-timone}
      DB_PASSWORD: ${DB_PASSWORD:?manca DB_PASSWORD in .env — esegui ./setup.sh, che la genera da solo, oppure impostala tu e rilancia}
    volumes:
      - ./docker/mysql/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      mysql:
        condition: service_healthy
    networks: [timone]

  # Backup automatico con restic (2026-10-30, docs/OPERATIONS.md «Backup e
  # ripristino»). Parte solo con il profilo «backup»: in produzione
  # COMPOSE_PROFILES=backup in .env, così anche i «docker compose up -d» dei
  # deploy lo ricostruiscono. Diverso dal servizio «backup» qui sopra, che
  # resta il dump manuale pre-deploy.
  backup-agent:
    build:
      context: ./docker/backup
      args:
        # Ripiego per l'hash del commit se .git non fosse visibile in
        # /project (setup.sh lo esporta; vuoto se assente).
        GIT_COMMIT: ${GIT_COMMIT:-}
    profiles: ["backup"]
    restart: unless-stopped
    # Hostname fisso: restic riconosce come scaduti i propri lucchetti
    # lasciati da un giro interrotto solo se l'host è lo stesso.
    hostname: timone-backup
    # Nessun env_file: la configurazione (backup.env, fuori da git) viene
    # riletta da /project a ogni giro, così una modifica vale subito senza
    # ricreare il container.
    environment:
      DB_HOST: mysql
      DB_DATABASE: ${DB_DATABASE:-timone}
    volumes:
      # Stesso percorso che ha nel container app: i file ripristinati
      # tornano al loro posto senza tradurre i percorsi.
      - storage_data:/var/www/html/storage/app:ro
      # Configurazione da salvare (.env, compose, docker/), backup.env, la
      # password del repository e .git per l'hash del commit.
      - ./:/project:ro
      # Copia locale: cartella dell'host e NON volume Docker, perché
      # «docker compose down -v» (il «reset totale» di setup.sh) cancella i
      # volumi. Su un secondo disco: vedi docs/OPERATIONS.md.
      - ./backups/restic:/repo
      - backup_status:/status
      - backup_cache:/cache
    # Un core al massimo, oltre a nice/ionice nello script: il backup non
    # deve rallentare chi lavora.
    cpus: 1.0
    depends_on:
      mysql:
        condition: service_healthy
    networks: [timone]

networks:
  timone:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  storage_data:
  storage_logs:
  # Esito dei backup (JSON) e registro: scritto da backup-agent, letto in
  # sola lettura dall'app per avvisi e pagina admin.
  backup_status:
  backup_cache:
